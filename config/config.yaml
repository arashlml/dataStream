storage:
  filePath: "last_inserted_id.csv"
state:
  resumeCapability: true
  attempts : 5
service:
  bufferSize : 10 # channel size
mongo :
  # "mongodb://host.docker.internal:27018"
  uri: "mongodb://mongodb:27017"
  username: ""
  password: ""
  db: "mydb"
  collection: "users"
  attempts : 5
  batchSize : 1000
  pingTimeout : 2
  connectTimeout : 2
  readTimeout: 2
  idType: "ObjectID"
elastic:
  uri: "http://elastic:9200"
  username: ""
  password: ""
  index: "users"
  attempts : 5
  pingTimeout : 5
  insertTimeout: 30
  retryInterval: 5
