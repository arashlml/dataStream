services:
  mongodb:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-data:/data/db

  elastic:
    image: elasticsearch:8.19.8
    ports:
      - 9200:9200
      - 9300:9300
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

  data-stream:
    build: .
    volumes:
      - .:/app
    ports:
      - "9091:9091"
    depends_on:
      - mongodb
      - elastic

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./metrics/prometheus.yaml:/etc/prometheus/prometheus.yml
    depends_on:
      - data-stream
      - mongo-exporter
      - elasticsearch-exporter

  grafana:
    image: grafana/grafana-oss:latest
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus

  mongo-exporter:
    image: percona/mongodb_exporter:0.40
    ports:
      - "9216:9216"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
    depends_on:
      - mongodb

  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter
    ports:
      - "9114:9114"
    command:
      - '--es.uri=http://elastic:9200'
    depends_on:
      - elastic

volumes:
  grafana-storage: